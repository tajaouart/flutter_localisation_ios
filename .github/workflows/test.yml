name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Test
        # The parity tests run xcstringstool, the catalog compiler Xcode uses.
        run: swift test

  example:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build
        working-directory: Example
        run: >
          xcodebuild -project LocalisationDemo.xcodeproj -scheme LocalisationDemo
          -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
